<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
        crossorigin="anonymous">
  <style>
    :root {
      --accent: #b3261e;
      --verified: #188038;
      --other: #5f6368;
      --surface: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --error: #d93025;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      color: var(--text); background: #f1f3f4;
      font: 14px/1.45 Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    button { font: inherit; cursor: pointer; }
    input[type=search], input[type=password] {
      font: inherit; font-size: 14px; color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; background: #fff; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn {
      background: #fff; color: var(--accent); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 12px; font-weight: 500; white-space: nowrap;
    }
    .btn:hover { background: color-mix(in srgb, var(--accent) 7%, #ffffff); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }

    /* Access key gate */
    .gate { min-height: 100%; display: grid; place-items: center; padding: 16px; }
    .gate-card {
      width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--border);
      border-top: 10px solid var(--accent); border-radius: 8px; padding: 24px;
    }
    .gate-card h1 { font-size: 22px; font-weight: 400; margin: 0 0 8px; }
    .gate-card p { color: var(--muted); margin: 0 0 16px; }
    .gate-row { display: flex; gap: 8px; }
    .gate-row input { flex: 1; min-width: 0; }
    .gate-error { color: var(--error); margin: 12px 0 0 !important; }

    /* App */
    .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; background: #fff; border-top: 4px solid var(--accent);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-size: 18px; font-weight: 500; margin: 0; }
    .count { color: var(--muted); }
    .spacer { flex: 1; }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .seg button { background: #fff; border: 0; padding: 6px 12px; color: var(--muted); }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
    .check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
    .check input { accent-color: var(--accent); }

    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
    .side { display: flex; flex-direction: column; min-height: 0; background: #fff; border-right: 1px solid var(--border); }
    .side-head { padding: 12px; border-bottom: 1px solid var(--border); }
    .side-head input { width: 100%; }
    .legend { display: flex; gap: 14px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
    .list li + li { border-top: 1px solid #eceff1; }
    .list button { display: block; width: 100%; text-align: left; background: #fff; border: 0; padding: 10px 14px; }
    .list button:hover, .list button.active { background: color-mix(in srgb, var(--accent) 6%, #ffffff); }
    .item-label { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
    .item-sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .empty { padding: 24px 16px; color: var(--muted); }
    .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; color: #fff; margin-left: 6px; vertical-align: 1px; }

    .map { min-height: 0; z-index: 0; }
    .pin { background: none; border: 0; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
    .leaflet-tooltip.pin-label {
      font: 500 12px/1.2 Roboto, Arial, sans-serif; padding: 3px 7px; border-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.3); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hide-labels .leaflet-tooltip.pin-label { display: none; }
    .popup { font: 13px/1.45 Roboto, Arial, sans-serif; min-width: 200px; max-width: 280px; }
    .popup h3 { font-size: 15px; font-weight: 500; margin: 0 0 4px; overflow-wrap: anywhere; }
    .popup p { margin: 4px 0; overflow-wrap: anywhere; }
    .popup .k { color: var(--muted); }
    .popup .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .status { padding: 8px 16px; color: var(--muted); font-size: 13px; background: #fff; border-bottom: 1px solid var(--border); }
    .status.error { color: var(--error); }

    @media (max-width: 760px) {
      .body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; overflow-y: auto; }
      .map { grid-row: 1; }
      .side { grid-row: 2; border-right: 0; border-top: 1px solid var(--border); }
      .list { overflow: visible; }
      .topbar { padding: 10px 12px; }
      .spacer { display: none; }
    }
  </style>
</head>
<body>
  <script>window.VESID_CONFIG = <?!= configJson ?>;</script>

  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form">
      <h1 id="gate-title">Address map</h1>
      <p>Enter the map access key. In your Google Sheet, choose <strong>911 Address Map &gt; Set up / show map access key</strong> to see it.</p>
      <div class="gate-row">
        <input type="password" id="key" autocomplete="current-password" placeholder="Access key" aria-label="Access key" required>
        <button type="submit" class="btn btn-primary" id="gate-btn">Open map</button>
      </div>
      <p class="gate-error" id="gate-error" role="alert" hidden></p>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <h1 id="app-title">Address map</h1>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <div class="tools">
        <label class="check"><input type="checkbox" id="labels-toggle" checked> Labels</label>
        <div class="seg" role="group" aria-label="Map type">
          <button type="button" data-layer="street" aria-pressed="true">Map</button>
          <button type="button" data-layer="satellite" aria-pressed="false">Satellite</button>
        </div>
        <button type="button" class="btn" id="refresh-btn">Refresh</button>
        <button type="button" class="btn" data-export="csv" title="Download the pins shown as CSV">CSV</button>
        <button type="button" class="btn" data-export="geojson" title="Download the pins shown as GeoJSON (GIS)">GeoJSON</button>
        <button type="button" class="btn" data-export="kml" title="Download the pins shown as KML (Google Earth, most CAD/GIS)">KML</button>
        <button type="button" class="btn" id="lock-btn" title="Forget the access key on this device">Lock</button>
      </div>
    </header>
    <div class="status" id="status" hidden></div>
    <div class="body">
      <aside class="side">
        <div class="side-head">
          <input type="search" id="filter" placeholder="Filter by name, address, phone..." aria-label="Filter pins">
          <div class="legend">
            <span><span class="dot" style="background:var(--accent)"></span>New</span>
            <span><span class="dot" style="background:var(--verified)"></span>Verified</span>
            <span><span class="dot" style="background:var(--other)"></span>Other</span>
          </div>
        </div>
        <ul class="list" id="list"></ul>
      </aside>
      <div class="map" id="map"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
          crossorigin="anonymous"></script>
  <script>
  (function () {
    'use strict';
    var C = window.VESID_CONFIG || {};
    var STORE_KEY = 'vesid-map-key';
    var $ = function (id) { return document.getElementById(id); };
    var title = (C.title || 'Address Registry') + ' - Map';
    if (C.themeColor) document.documentElement.style.setProperty('--accent', C.themeColor);
    $('gate-title').textContent = title;
    $('app-title').textContent = title;

    var store = {
      get: function () { try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; } },
      set: function (v) { try { localStorage.setItem(STORE_KEY, v); } catch (e) { /* not available */ } },
      clear: function () { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* not available */ } }
    };

    var accessKey = '';
    var rows = [];
    var markers = [];      // parallel to rows
    var map = null;
    var layers = null;
    var activeLayer = null;
    var group = null;
    var firstLoad = true;

    function cleanServerMessage(err) {
      var msg = (err && err.message) || String(err || '');
      return msg.replace(/^(Error|Exception|ScriptError):\s*/i, '') || 'Something went wrong.';
    }

    function hasRun() { return !!(window.google && google.script && google.script.run); }

    // ---- Gate ----------------------------------------------------------
    function tryKey(key, fromStore) {
      if (!hasRun()) { gateError('Open this page from its web app link (ending in ?view=map).'); return; }
      $('gate-btn').disabled = true;
      $('gate-btn').textContent = 'Opening...';
      google.script.run
        .withSuccessHandler(function (data) {
          accessKey = key;
          store.set(key);
          $('gate').hidden = true;
          $('app').hidden = false;
          initMap();
          render(data || []);
        })
        .withFailureHandler(function (err) {
          $('gate-btn').disabled = false;
          $('gate-btn').textContent = 'Open map';
          if (fromStore) store.clear();
          gateError(cleanServerMessage(err));
        })
        .getSubmissions(key);
    }
    function gateError(msg) { $('gate-error').textContent = msg; $('gate-error').hidden = false; }

    $('gate-form').addEventListener('submit', function (e) {
      e.preventDefault();
      $('gate-error').hidden = true;
      var key = $('key').value.trim();
      if (key) tryKey(key, false);
    });
    var saved = store.get();
    if (saved) tryKey(saved, true);

    $('lock-btn').addEventListener('click', function () {
      store.clear();
      location.reload();
    });

    // ---- Map -----------------------------------------------------------
    function initMap() {
      if (map) return;
      if (!window.L) { showStatus('The map library could not load. Check your connection and reload.', true); return; }
      map = L.map('map', { zoomControl: true }).setView(C.mapCenter || [39.8283, -98.5795], C.mapZoom || 4);
      layers = {
        street: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 20, maxNativeZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
        }),
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 20, maxNativeZoom: 19,
          attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
        })
      };
      activeLayer = layers.street.addTo(map);
      group = L.featureGroup().addTo(map);
      map.on('zoomend', updateLabelVisibility);
      setTimeout(function () { map.invalidateSize(); }, 200);
      window.addEventListener('resize', function () { map.invalidateSize(); });
    }

    document.querySelectorAll('.seg button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!map) return;
        var next = layers[btn.getAttribute('data-layer')];
        if (next === activeLayer) return;
        map.removeLayer(activeLayer);
        activeLayer = next.addTo(map);
        document.querySelectorAll('.seg button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === btn));
        });
      });
    });

    function statusColor(status) {
      var s = String(status || '').trim().toLowerCase();
      if (s === '' || s === 'new') return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#b3261e';
      if (s === 'verified') return '#188038';
      return '#5f6368';
    }

    function pinIcon(color) {
      return L.divIcon({
        className: 'pin',
        html: '<svg width="28" height="38" viewBox="0 0 34 46" aria-hidden="true">' +
              '<path d="M17 1C8.2 1 1 8 1 16.7 1 28.5 17 45 17 45s16-16.5 16-28.3C33 8 25.8 1 17 1z" ' +
              'fill="' + color + '" stroke="#fff" stroke-width="2.4"/>' +
              '<circle cx="17" cy="16.5" r="6" fill="#fff"/></svg>',
        iconSize: [28, 38], iconAnchor: [14, 37], popupAnchor: [0, -34], tooltipAnchor: [0, -36]
      });
    }

    function el(tag, className, text) {
      var n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined && text !== null) n.textContent = text;
      return n;
    }

    function formatDate(iso) {
      var d = new Date(iso);
      return isNaN(d) ? String(iso || '') : d.toLocaleString();
    }

    function popupFor(r) {
      var box = el('div', 'popup');
      box.appendChild(el('h3', '', r.label || '(no name)'));
      if (r.street) box.appendChild(el('p', '', r.street));
      var addKV = function (k, v) {
        if (!v) return;
        var p = el('p');
        p.appendChild(el('span', 'k', k + ': '));
        p.appendChild(document.createTextNode(v));
        box.appendChild(p);
      };
      addKV('Contact', [r.name, r.phone].filter(Boolean).join(' / '));
      addKV('Notes', r.notes);
      addKV('Coordinates', r.lat.toFixed(6) + ', ' + r.lng.toFixed(6));
      var link = el('a', '', 'Open in Google Maps');
      link.href = 'https://www.google.com/maps/search/?api=1&query=' + r.lat + ',' + r.lng;
      link.target = '_blank';
      link.rel = 'noopener';
      var lp = el('p');
      lp.appendChild(link);
      box.appendChild(lp);
      box.appendChild(el('p', 'meta',
        'Status: ' + (r.status || 'New') + ' | Ref ' + (r.reference || '-') +
        ' | Sheet row ' + r.row + ' | ' + formatDate(r.submittedAt)));
      return box;
    }

    function render(data) {
      rows = data.slice().sort(function (a, b) {
        return String(b.submittedAt).localeCompare(String(a.submittedAt));
      });
      group.clearLayers();
      markers = rows.map(function (r) {
        var m = L.marker([r.lat, r.lng], { icon: pinIcon(statusColor(r.status)), title: r.label || '' });
        m.bindPopup(popupFor(r), { maxWidth: 300 });
        m.bindTooltip(el('span', '', r.label || '(no name)'), {
          permanent: true, direction: 'top', className: 'pin-label', interactive: false
        });
        return m;
      });
      applyFilter();
      if (firstLoad || rows.length) fitToVisible();
      firstLoad = false;
      if (!rows.length) showStatus('No pins yet. Responses will appear here as people submit the survey.');
      else hideStatus();
    }

    function matches(r, q) {
      if (!q) return true;
      return [r.label, r.street, r.name, r.phone, r.notes, r.reference, r.status]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    }

    function visibleIndexes() {
      var q = $('filter').value.trim().toLowerCase();
      var out = [];
      rows.forEach(function (r, i) { if (matches(r, q)) out.push(i); });
      return out;
    }

    function applyFilter() {
      var vis = visibleIndexes();
      var list = $('list');
      list.innerHTML = '';
      group.clearLayers();
      vis.forEach(function (i) {
        var r = rows[i];
        group.addLayer(markers[i]);
        var li = el('li');
        var b = el('button');
        b.type = 'button';
        var lab = el('div', 'item-label', r.label || '(no name)');
        var chip = el('span', 'chip', r.status || 'New');
        chip.style.background = statusColor(r.status);
        lab.appendChild(chip);
        b.appendChild(lab);
        b.appendChild(el('div', 'item-sub', r.street || (r.lat.toFixed(5) + ', ' + r.lng.toFixed(5))));
        b.appendChild(el('div', 'item-sub', [r.name, r.phone].filter(Boolean).join(' / ') || formatDate(r.submittedAt)));
        b.addEventListener('click', function () {
          list.querySelectorAll('button.active').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          map.setView([r.lat, r.lng], Math.max(map.getZoom(), 17));
          markers[i].openPopup();
          if (window.matchMedia('(max-width: 760px)').matches) $('map').scrollIntoView({ behavior: 'smooth' });
        });
        li.appendChild(b);
        list.appendChild(li);
      });
      if (!vis.length) list.appendChild(el('li', 'empty', rows.length ? 'No pins match the filter.' : 'No pins yet.'));
      var total = rows.length;
      $('count').textContent = vis.length === total
        ? total + (total === 1 ? ' pin' : ' pins')
        : vis.length + ' of ' + total + ' pins';
      updateLabelVisibility();
    }

    function fitToVisible() {
      var b = group.getBounds();
      if (b.isValid()) map.fitBounds(b.pad(0.15), { maxZoom: 17 });
    }

    function updateLabelVisibility() {
      if (!map) return;
      var crowded = group.getLayers().length > 40 && map.getZoom() < 14;
      $('map').classList.toggle('hide-labels', !$('labels-toggle').checked || crowded);
    }

    var filterTimer = null;
    $('filter').addEventListener('input', function () {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(applyFilter, 150);
    });
    $('labels-toggle').addEventListener('change', updateLabelVisibility);

    $('refresh-btn').addEventListener('click', function () {
      var btn = $('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Refreshing...';
      google.script.run
        .withSuccessHandler(function (data) {
          btn.disabled = false; btn.textContent = 'Refresh';
          render(data || []);
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = 'Refresh';
          showStatus(cleanServerMessage(err), true);
        })
        .getSubmissions(accessKey);
    });

    function showStatus(msg, isError) {
      var s = $('status');
      s.textContent = msg;
      s.classList.toggle('error', !!isError);
      s.hidden = false;
    }
    function hideStatus() { $('status').hidden = true; }

    // ---- Export --------------------------------------------------------
    var FIELDS = [
      ['Reference', 'reference'], ['Address Name', 'label'], ['Latitude', 'lat'], ['Longitude', 'lng'],
      ['Street Address', 'street'], ['Contact Name', 'name'], ['Phone', 'phone'],
      ['Notes for Responders', 'notes'], ['Status', 'status'], ['Submitted At', 'submittedAt']
    ];

    function csvCell(v) {
      var s = v === null || v === undefined ? '' : String(v);
      if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s; // stop spreadsheet formulas
      return '"' + s.replace(/"/g, '""') + '"';
    }
    function xml(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }

    function exportRows(kind) {
      var data = visibleIndexes().map(function (i) { return rows[i]; });
      if (!data.length) { showStatus('There are no pins to export.', true); return; }
      var stamp = new Date().toISOString().slice(0, 10);
      var base = 'address-pins-' + stamp;
      if (kind === 'csv') {
        var lines = [FIELDS.map(function (f) { return csvCell(f[0]); }).join(',')];
        data.forEach(function (r) {
          lines.push(FIELDS.map(function (f) { return csvCell(r[f[1]]); }).join(','));
        });
        download(base + '.csv', 'text/csv;charset=utf-8', '\ufeff' + lines.join('\r\n'));
      } else if (kind === 'geojson') {
        var fc = {
          type: 'FeatureCollection',
          features: data.map(function (r) {
            var props = {};
            FIELDS.forEach(function (f) { if (f[1] !== 'lat' && f[1] !== 'lng') props[f[1]] = r[f[1]]; });
            return { type: 'Feature', geometry: { type: 'Point', coordinates: [r.lng, r.lat] }, properties: props };
          })
        };
        download(base + '.geojson', 'application/geo+json', JSON.stringify(fc, null, 2));
      } else if (kind === 'kml') {
        var out = ['<?xml version="1.0" encoding="UTF-8"?>',
          '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>',
          '<name>' + xml(C.title || 'Address pins') + '</name>'];
        data.forEach(function (r) {
          var desc = [r.street, r.notes && ('Notes: ' + r.notes), [r.name, r.phone].filter(Boolean).join(' / ')]
            .filter(Boolean).join('\n');
          out.push('<Placemark><name>' + xml(r.label) + '</name>' +
            '<description>' + xml(desc) + '</description><ExtendedData>' +
            FIELDS.map(function (f) {
              return '<Data name="' + xml(f[0]) + '"><value>' + xml(r[f[1]]) + '</value></Data>';
            }).join('') +
            '</ExtendedData><Point><coordinates>' + r.lng + ',' + r.lat + ',0</coordinates></Point></Placemark>');
        });
        out.push('</Document></kml>');
        download(base + '.kml', 'application/vnd.google-earth.kml+xml', out.join('\n'));
      }
    }

    function download(filename, type, text) {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    document.querySelectorAll('[data-export]').forEach(function (btn) {
      btn.addEventListener('click', function () { exportRows(btn.getAttribute('data-export')); });
    });
  })();
  </script>
</body>
</html>
